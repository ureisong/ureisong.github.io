<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#171226" />
  <title>페이지를 찾을 수 없습니다 · 들어줄레이🍇👻</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #171226; color: #f5f0ff; }
    body { box-sizing: border-box; min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; text-align: center; }
    main { max-width: 34rem; }
    h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin: 0 0 12px; }
    p { color: #c9c0dc; line-height: 1.7; }
    a { color: #d9b8ff; }
  </style>
  <script>
    (() => {
      const match = window.location.pathname.match(/\/share\/([^/]+)\.html$/i);
      if (!match) return;
      let songId = "";
      try {
        songId = decodeURIComponent(match[1]);
      } catch (_) {
        return;
      }
      if (!songId) return;
      const target = new URL("/", window.location.origin);
      target.searchParams.set("id", songId);
      window.location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <main>
    <h1>페이지를 찾을 수 없습니다.</h1>
    <p>요청한 페이지가 없거나 주소가 변경되었습니다. 공유 곡 페이지라면 해당 곡으로 이동을 시도합니다.</p>
    <p><a href="/">들어줄레이🍇👻 메인 페이지로 이동</a></p>
  </main>
</body>
</html>
